// proto/core.proto
// Protocol Buffers definition for the Core service interface.
// Defines the Core gRPC service, its ItemLookup method, and the ItemRequest/ItemResponse message types.
// This file is used as the source for generating Go gRPC code using protoc.
syntax = "proto3";

package core;

option go_package = "go-core-service/internal/corepb";

service Core {
  rpc ItemLookup (ItemRequest) returns (ItemResponse);
}

message ItemRequest {
  string item = 1;
}

message ItemResponse {
  string status = 1;
}
